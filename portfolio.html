<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXYRA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding: 40px 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 60px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-decoration: none;
    }

    .logo span {
      color: #0066ff;
    }

    .nav-links a {
      color: #888888;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    /* Section Formulaire */
    .container {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .subtitle {
      color: #0066ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .title {
      font-size: 56px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .title span {
      color: #0066ff;
    }

    .description {
      color: #a0a0a0;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* Formulaire */
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
    }

    input, select, textarea {
      width: 100%;
      background-color: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    input::placeholder, textarea::placeholder {
      color: #444444;
    }

    select {
      color: #888888;
      appearance: none;
    }

    .btn-submit {
      background-color: #0066ff;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 16px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Section Portfolio Instagram */
    .portfolio-section {
      max-width: 1000px;
      margin: 80px auto 40px;
      text-align: left;
    }

    .portfolio-title {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .portfolio-grid img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 60px;
    }

    footer a {
      color: #666666;
      text-decoration: none;
      font-size: 14px;
    }

    footer a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">NEXYRA<span>.</span></a>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="#contact">Contact</a>
      <a href="https://instagram.com" target="_blank">Instagram</a>
    </div>
  </header>

  <!-- Section Formulaire -->
  <div class="container" id="contact">
    <div class="subtitle">PARLONS DE VOTRE PROJET</div>
    <h1 class="title">UN PROJET EN <span>TÊTE ?</span></h1>
    <p class="description">
      Remplissez le formulaire ci-dessous ou écrivez-nous directement.<br>
      Nous vous répondons sous 24 à 48 heures.
    </p>

    <form>
      <div class="form-row">
        <div class="form-group">
          <label>NOM / PRÉNOM *</label>
          <input type="text" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>ADRESSE E-MAIL *</label>
          <input type="email" placeholder="john@exemple.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>TYPE DE PROJET *</label>
          <select>
            <option>Sélectionnez un besoin</option>
          </select>
        </div>
        <div class="form-group">
          <label>BUDGET ESTIMÉ</label>
          <select>
            <option>Sélectionnez une tranche</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>MESSAGE / DÉTAILS DU PROJET *</label>
        <textarea rows="4" placeholder="Décrivez votre projet, vos objectifs et vos délais..."></textarea>
      </div>

      <button type="submit" class="btn-submit">ENVOYER LE MESSAGE</button>
    </form>
  </div>

  <!-- Section Portfolio Instagram -->
  <div class="portfolio-section">
    <h2 class="portfolio-title">PORTFOLIO INSTAGRAM</h2>
    <div class="portfolio-grid">
      <img src="affiche-usap.jpg" alt="Affiche Match Amical">
      <img src="affiche-usap.jpg" alt="Affiche Match Amical">
      <img src="affiche-usap.jpg" alt="Affiche Match Amical">
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <a href="mailto:contact@nexyra.com">contact@nexyra.com</a>
    <a href="https://instagram.com" target="_blank">Instagram</a>
  </footer>

</body>
</html>
