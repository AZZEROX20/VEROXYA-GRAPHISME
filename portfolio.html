<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXYRA — Portfolio</title>
  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.5;
    }

    /* Navigation Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background-color: #000000;
      border-bottom: 1px solid #1a1a1a;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
    }
    .logo span {
      color: #0066ff;
    }
    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
      transition: color 0.3s;
    }
    nav a:hover, nav a.active {
      color: #0066ff;
    }

    /* Formulaire de Contact Section */
    .contact-section {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    .subtitle {
      color: #0066ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .title-banner {
      font-size: 38px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .title-banner span {
      color: #0066ff;
    }
    .intro-text {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }
    .form-row {
      display: flex;
      gap: 16px;
    }
    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #ccc;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      background-color: #121212;
      border: 1px solid #222;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #0066ff;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #0066ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s;
    }
    .btn-submit:hover {
      background-color: #0052cc;
    }

    /* Section Portfolio Instagram */
    .portfolio-section {
      max-width: 1000px;
      margin: 60px auto 40px;
      padding: 0 20px;
    }
    .portfolio-title {
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 25px;
      text-align: left;
    }

    /* Grille et cartes d'images RÉTRÉCIES */
    .portfolio-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: flex-start;
    }
    .portfolio-card {
      width: 100%;
      max-width: 250px; /* Taille de la carte fortement réduite */
      background-color: #121212;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
    }
    .portfolio-card:hover {
      transform: translateY(-4px);
      border-color: #0066ff;
    }
    .portfolio-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
      font-size: 14px;
      color: #888;
      border-top: 1px solid #1a1a1a;
      margin-top: 40px;
    }
    footer a {
      color: #888;
      text-decoration: none;
    }
    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="index.html" class="logo">NEXYRA<span>.</span></a>
    <nav>
      <a href="#contact">Contact</a>
      <a href="https://instagram.com" target="_blank">Instagram</a>
    </nav>
  </header>

  <!-- Section Formulaire -->
  <section class="contact-section" id="contact">
    <p class="subtitle">PARLONS DE VOTRE PROJET</p>
    <h1 class="title-banner">UN PROJET EN <span>TÊTE ?</span></h1>
    <p class="intro-text">
      Remplissez le formulaire ci-dessous ou écrivez-nous directement.<br>
      Nous vous répondons sous 24 à 48 heures.
    </p>

    <form class="contact-form">
      <div class="form-row">
        <div class="form-group">
          <label>NOM / PRÉNOM *</label>
          <input type="text" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>ADRESSE E-MAIL *</label>
          <input type="email" placeholder="john@exemple.com" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>TYPE DE PROJET *</label>
          <select required>
            <option value="" disabled selected>Sélectionnez un besoin</option>
            <option value="graphisme">Design Graphique</option>
            <option value="site">Site Web</option>
          </select>
        </div>
        <div class="form-group">
          <label>BUDGET ESTIMÉ</label>
          <select>
            <option value="" disabled selected>Sélectionnez une tranche</option>
            <option value="small">< 500 €</option>
            <option value="medium">500 € - 1500 €</option>
            <option value="large">> 1500 €</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>MESSAGE / DÉTAILS DU PROJET *</label>
        <textarea rows="5" placeholder="Décrivez votre projet, vos objectifs et vos délais..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">ENVOYER LE MESSAGE</button>
    </form>
  </section>

  <!-- Section Portfolio Instagram -->
  <section class="portfolio-section">
    <h2 class="portfolio-title">PORTFOLIO INSTAGRAM</h2>
    <div class="portfolio-grid">
      
      <!-- Carte Réduite 1 -->
      <div class="portfolio-card">
        <img src="affiche-usap.jpg" alt="Affiche Match Amical US Anizy Pinon">
      </div>

      <!-- Carte Réduite 2 -->
      <div class="portfolio-card">
        <img src="affiche-usap.jpg" alt="Affiche Match Amical US Anizy Pinon">
      </div>

      <!-- Carte Réduite 3 -->
      <div class="portfolio-card">
        <img src="affiche-usap.jpg" alt="Affiche Match Amical US Anizy Pinon">
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <a href="mailto:contact@nexyra.com">contact@nexyra.com</a>
    <a href="https://instagram.com" target="_blank">Instagram</a>
  </footer>

</body>
</html>
